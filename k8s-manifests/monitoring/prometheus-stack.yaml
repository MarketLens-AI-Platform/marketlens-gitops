apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketlens-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 60.0.0
    chart: kube-prometheus-stack
    helm:
      values: |
        grafana:
          enabled: true
          adminPassword: prom-operator
          additionalDataSources:
            - name: Prometheus
              type: prometheus
              url: http://marketlens-monitoring-kube-p-prometheus.marketlens.svc.cluster.local:9090
              access: proxy
              isDefault: true
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
  destination:
    server: https://kubernetes.default.svc
    namespace: marketlens
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
