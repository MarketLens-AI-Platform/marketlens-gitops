apiVersion: batch/v1
kind: CronJob
metadata:
  name: marketlens-ingestion
  namespace: marketlens
spec:
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: marketlens-sa
          containers:
          - name: ingestion
            image: ghcr.io/marketlens-ai-platform/marketlens-ingestion:latest
            envFrom:
            - secretRef:
                name: marketlens-secrets
          restartPolicy: OnFailure
