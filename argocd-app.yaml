apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketlens-ai-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MarketLens-AI-Platform/marketlens-gitops
    targetRevision: HEAD
    path: k8s-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: marketlens
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
